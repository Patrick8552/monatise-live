name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monatise_test
          POSTGRES_USER: monatise
          POSTGRES_PASSWORD: monatise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monatise -d monatise_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONATISE_TEST_DATABASE_URL: postgresql://monatise:monatise_test@127.0.0.1:5432/monatise_test
      MONATISE_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      MONATISE_ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

  ui-quality:
    name: UI quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install UI tooling
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run responsive UI checks
        run: npm run test:visual
      - name: Run Lighthouse budgets
        run: npm run test:lighthouse
