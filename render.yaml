# Production-facing analysis-only Blueprint. The previous Render deployment
# remains available for rollback until this definition is manually promoted.
services:
  - type: web
    name: monatise-live
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install .
    startCommand: uvicorn monatise.application.production:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-graceful-shutdown 30
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - key: MONATISE_MODE
        value: paper
      - key: MONATISE_ENVIRONMENT
        value: production
      - key: MONATISE_NETWORK
        value: paper
      - key: MONATISE_EXECUTION_ENABLED
        value: false
      - key: MONATISE_AUTONOMOUS_EXECUTION
        value: false
      - key: MONATISE_EXECUTION_ADAPTER_ENABLED
        value: false
      - key: MONATISE_ALLOW_LIVE_ORDERS
        value: false
      - key: MONATISE_OPENCLAW_EXECUTION_ALLOWED
        value: false
      - key: MONATISE_TELEGRAM_EXECUTION_ALLOWED
        value: false
      - key: MONATISE_GOVERNANCE_KILL_SWITCH_ENABLED
        value: true
      - key: MONATISE_AUDIT_LOGGING_ENABLED
        value: true
      # Temporary until a real production macro provider is integrated.
      - key: MONATISE_ALLOW_DEGRADED_MACRO
        value: true
      - key: MONATISE_REDIS_NAMESPACE
        value: monatise:production-analysis
      - key: MONATISE_SCHEDULED_ANALYSIS_ENABLED
        value: true
      - key: MONATISE_SCHEDULED_ANALYSIS_SYMBOLS
        value: BTC,ETH,SOL
      - key: MONATISE_SCHEDULED_ANALYSIS_INTERVAL_SECONDS
        value: 900
      - key: MONATISE_HIERARCHICAL_SHADOW_ENABLED
        value: true
      - key: MONATISE_HIERARCHICAL_TELEGRAM_PUBLISH_ENABLED
        value: true
      - key: MONATISE_HIERARCHICAL_STRATEGY_VERSION
        value: hierarchy-shadow-v1
      - key: MONATISE_DATABASE_URL
        fromDatabase:
          name: monatise-live-postgres
          property: connectionString
      - key: MONATISE_REDIS_URL
        fromService:
          type: keyvalue
          name: monatise-live-redis
          property: connectionString
      - key: COINGLASS_API_KEY
        sync: false
      - key: MONATISE_TELEGRAM_BOT_TOKEN
        sync: false
      - key: MONATISE_TELEGRAM_CHAT_ID
        sync: false
      - key: MONATISE_OPENCLAW_TOKEN
        sync: false

  - type: keyvalue
    name: monatise-live-redis
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: monatise-live-postgres
    plan: basic-256mb
    region: oregon
    databaseName: monatise_live
    user: monatise_production
